# ==========================
# True Color & Kitty Support (CRITICAL FOR VIM)
# ==========================
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# ==========================
# Core Settings
# ==========================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g history-limit 10000

# Start windows and panes at 1, not 0 (Easier to reach on the keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
# Key Bindings
# ==========================
# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive window splitting (opens in current dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ==========================
# UI & Minimalism (Naysayer Theme)
# ==========================
# Clean, distraction-free status bar moved to the top
set -g status-position bottom

# Background: Deep Teal (#062329), Foreground: Sand (#d1b897)
set -g status-style 'bg=#062329 fg=#d1b897' 

# 1. Pane Borders: Clear focus on the active pane
set -g pane-border-style 'fg=#0d3a43'              # Inactive panes (subtle teal)
set -g pane-active-border-style 'fg=#87d8c3'       # Active pane (Naysayer mint)

# 2. Command Prompt & Messages
set -g message-style 'bg=#062329 fg=#87d8c3 bold'  # Mint text for commands/messages

# 3. Window Status (Tabs): Clear indication of where you are
set -g status-justify centre                       # Center the window list
set -g window-status-separator ""                  # Remove default spacing

# Inactive window format (dimmed grey-teal)
setw -g window-status-format "#[fg=#708284,bg=#062329]  #I: #W  "

# Active window format (highlighted mint background, dark text)
setw -g window-status-current-format "#[fg=#062329,bg=#87d8c3,bold]  #I: #W  "

# 4. Status Left/Right Info
set -g status-left-length 40
set -g status-left "#[fg=#2ea5aa,bold] #S "        # Show session name in Naysayer blue
set -g status-right "#[fg=#d1b897] %H:%M "         # Time clean and minimal

# ==========================
# Plugins (Productivity)
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless Vim/Neovim integration
set -g @plugin 'christoomey/vim-tmux-navigator'

# System clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Session management (Never lose your workflow)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
